<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q-ADMIN-TEMPLATE</title>
</head>

<body>
  <div id="app">
    <svg width="60" height="60" viewBox="0 0 60 60"
      style="position: fixed; top:50%; left:50%; transform: translate(-50%,-50%);">
      <circle cx="30" cy="30" r="24" fill="none" stroke="var(--el-color-primary)" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="110 160">
        <animateTransform attributeName="transform" type="rotate" from="0 30 30" to="360 30 30" dur="1s"
          repeatCount="indefinite" />
      </circle>

      <text x="30" y="30" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--el-color-primary)">
        载入中
      </text>
    </svg>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
